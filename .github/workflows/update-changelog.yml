name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-changelog-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Append merged PR to changelog
        run: node apps/portal/scripts/update-changelog.mjs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(portal): update changelog for PR #${{ github.event.pull_request.number }}"
          file_pattern: apps/portal/src/data/changelog.json
