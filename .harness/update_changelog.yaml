pipeline:
  name: Update Changelog
  identifier: update_changelog
  projectIdentifier: Harness_Commons
  orgIdentifier: PROD
  tags: {}
  properties:
    ci:
      codebase:
        build: <+input>
  stages:
    - stage:
        name: Update Changelog
        identifier: update_changelog
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - step:
                  type: Run
                  name: Append merged PR to changelog
                  identifier: append_changelog
                  spec:
                    image: node:20
                    shell: Sh
                    envVariables:
                      PR_NUMBER: <+trigger.prNumber>
                      PR_TITLE: <+trigger.prTitle>
                      PR_AUTHOR: <+trigger.gitUser>
                    command: |-
                      set -euo pipefail

                      export PR_MERGED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      node apps/portal/scripts/update-changelog.mjs

                      if git diff --quiet -- apps/portal/src/data/changelog.json; then
                        echo "Changelog already up to date."
                        exit 0
                      fi

                      git config user.name "harness-changelog-bot"
                      git config user.email "changelog-bot@harness.io"
                      git add apps/portal/src/data/changelog.json
                      git commit -m "docs(portal): update changelog for PR #<+trigger.prNumber> [skip changelog]"

                      git fetch origin main
                      git rebase origin/main
                      git push origin HEAD:main
